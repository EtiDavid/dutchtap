name: Grammar feature validation

on:
  push:
    branches:
      - 'feat/grammar-mastery-phase1'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check source data regeneration is deterministic
        run: |
          python3 scripts/build-grammar-patterns.py
          git diff --exit-code -- data/grammar-pattern-cards.json data/grammar-pattern-notes.json
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run content:learning-check
      - run: npm run build
      - name: Install Chromium for learning-flow browser tests
        run: npx playwright install --with-deps chromium
      - name: Check Grammar Mastery learning on a guest browser
        run: npm run test:flashcards -- tests/flashcard-e2e/grammar-mastery.spec.ts tests/flashcard-e2e/grammar-patterns.spec.ts
